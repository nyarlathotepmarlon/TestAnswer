name: Java verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test
        run: mvn -B -ntp clean verify
      - name: Run demonstration
        run: java '-Dfile.encoding=UTF-8' -jar target/lsm-tree-1.0.0.jar demo
      - name: Upload executable JAR and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsm-tree-${{ matrix.os }}
          path: |
            target/lsm-tree-1.0.0.jar
            target/surefire-reports/
